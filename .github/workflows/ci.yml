name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04          # pinned so the "noble" URL below matches
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: "https://packagemanager.posit.co/cran/__linux__/noble/latest"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libfontconfig1-dev \
            libfreetype6-dev libfribidi-dev libharfbuzz-dev libjpeg-dev \
            libpng-dev libtiff-dev libx11-dev pandoc

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-4.4-${{ hashFiles('renv.lock') }}

      - name: Restore packages from renv.lock
        run: |
          Rscript -e 'install.packages("renv")'
          Rscript -e 'renv::restore(library = Sys.getenv("R_LIBS_USER"), prompt = FALSE)'

      - name: Run tests
        run: Rscript tests/testthat.R

      - name: Lint
        run: |
          Rscript -e 'if (!requireNamespace("lintr", quietly = TRUE)) install.packages("lintr")'
          Rscript -e 'lintr::lint("app.R")'
        continue-on-error: true

      - name: Smoke-test app launch
        run: |
          Rscript -e 'shiny::runApp("app.R", port = 3838, launch.browser = FALSE)' &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3838 > /dev/null; then
              echo "App responded on :3838"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond within 60s"
          exit 1