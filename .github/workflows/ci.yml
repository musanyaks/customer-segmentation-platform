name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinydashboard
            any::tidyverse
            any::lubridate
            any::scales
            any::plotly
            any::DT
            any::cluster
            any::cachem
            any::testthat
            any::lintr

      - name: Run tests
        run: Rscript tests/testthat.R

      - name: Lint
        run: Rscript -e 'lintr::lint_dir(".")'
        continue-on-error: true

      - name: Smoke-test app launch
        run: |
          Rscript -e '
            shiny::runApp("app.R", port = 3838, launch.browser = FALSE,
                          test.mode = TRUE) &
            Sys.sleep(20)
            con <- url("http://localhost:3838")
            open(con); close(con)
            message("App responded on :3838")'