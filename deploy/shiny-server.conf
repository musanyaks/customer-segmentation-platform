# /etc/shiny-server/shiny-server.conf
# App location: /srv/shiny-server/customer-segmentation/app.R

run_as shiny;
preserve_logs true;

server {
  listen 3838;

  location / {
    app_dir /srv/shiny-server/customer-segmentation;
    log_dir /var/log/shiny-server;

    # generous startup window for package loading
    app_init_timeout 120;
    app_idle_timeout 300;

    # sanitize errors shown to end users
    sanitize_errors on;
  }
}